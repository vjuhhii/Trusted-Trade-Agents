[project]
name = "aimo-agent"
version = "0.1.0"
description = "Junction 2026 x Valio Aimo: an open interface that lets external purchasing agents look up, order and get approvals"
authors = [
    { name = "vjuhhii", email = "47525859+vjuhhii@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "pydantic-settings>=2.16.3",
    "pyjwt[crypto]>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
