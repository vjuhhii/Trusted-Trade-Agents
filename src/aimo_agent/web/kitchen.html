<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your purchasing assistant</title>
<style>
  :root {
    --bg: #f5f4f1; --panel: #ffffff; --line: #e4e1da; --text: #1b1f24; --muted: #646b75;
    --accent: #0b5cad; --ok: #12703b; --ok-bg: #e2f3e8; --warn: #8a5200; --warn-bg: #fdf0d3;
    --bad: #a11f1f; --bad-bg: #fbe3e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101418; --panel: #1a2029; --line: #2c3541; --text: #eceff3; --muted: #9aa6b5;
      --accent: #74b6ff; --ok: #6fd69a; --ok-bg: #143523; --warn: #f0c36e; --warn-bg: #3a2d10;
      --bad: #ff9c9c; --bad-bg: #401a1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header { margin-bottom: 22px; }
  header .hello { font-size: 14px; color: var(--muted); }
  h1 { font-size: 25px; line-height: 1.2; margin: 2px 0 0; }
  h2 { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
       margin: 30px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
          padding: 18px; margin-bottom: 12px; }
  .ask { border: 2px solid var(--warn); }
  .asked { color: var(--muted); font-size: 15px; margin: 0 0 12px; }
  .what { font-size: 19px; font-weight: 650; line-height: 1.3; margin: 0; }
  .sub { color: var(--muted); font-size: 15px; }
  .price { font-size: 30px; font-weight: 700; margin: 10px 0 0; font-variant-numeric: tabular-nums; }
  .why { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px;
         margin: 14px 0 0; font-size: 16px; }
  .why b { display: block; margin-bottom: 2px; }
  .buttons { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-top: 16px; }
  button { font: inherit; font-weight: 650; border-radius: 12px; border: 2px solid transparent;
           min-height: 54px; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .55; }
  .yes { background: var(--ok); color: #fff; font-size: 19px; }
  @media (prefers-color-scheme: dark) { .yes { color: #0c1410; } }
  .no { background: transparent; color: var(--text); border-color: var(--line); }
  .calm { text-align: center; padding: 26px 18px; }
  .calm .tick { font-size: 34px; line-height: 1; color: var(--ok); }
  .calm p { margin: 8px 0 0; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 0;
          border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; padding-top: 0; }
  .item:last-child { padding-bottom: 0; }
  .item .name { font-weight: 600; line-height: 1.35; }
  .item .amount { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .note { grid-column: 1 / -1; font-size: 15px; color: var(--muted); }
  .pill { display: inline-block; border-radius: 99px; padding: 1px 10px; font-size: 13px;
          font-weight: 650; margin-right: 6px; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.wait { background: var(--warn-bg); color: var(--warn); }
  .pill.stop { background: var(--bad-bg); color: var(--bad); }
  .rule { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;
          padding: 14px 0; border-top: 1px solid var(--line); }
  .rule:first-child { border-top: 0; padding-top: 0; }
  .rule small { display: block; color: var(--muted); font-size: 14px; line-height: 1.35; }
  .rule.spend { grid-template-columns: 1fr; }
  .rule.spend .stepper { justify-content: flex-start; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { min-height: 44px; width: 44px; background: var(--bg); color: var(--text);
                    border-color: var(--line); font-size: 22px; }
  .stepper input { width: 96px; min-height: 44px; text-align: center; font: inherit;
                   font-weight: 650; border: 1px solid var(--line); border-radius: 10px;
                   background: var(--panel); color: var(--text); }
  .switch { position: relative; width: 56px; height: 32px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line);
                 transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px;
                        height: 24px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::after { left: 28px; }
  .switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
  .never { font-size: 15px; color: var(--muted); margin: 14px 0 0; padding-top: 14px;
           border-top: 1px solid var(--line); }
  .me { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 15px;
        color: var(--muted); }
  select { font: inherit; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); }
  footer { margin-top: 30px; text-align: center; font-size: 14px; color: var(--muted); }
  footer a { color: var(--accent); }
  #saved { color: var(--ok); font-weight: 650; visibility: hidden; margin-left: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="hello" id="buyer">Your kitchen</div>
    <h1>Your purchasing assistant</h1>
    <label class="me">I am <select id="me" aria-label="Who is deciding"></select></label>
  </header>

  <div id="asks"></div>

  <h2>What it did for you</h2>
  <div class="card" id="done"></div>

  <h2>Your rules <span id="saved">Saved</span></h2>
  <div class="card" id="rules"></div>

  <footer>You talk to your assistant in your own words. This page is where it asks you.<br>
    <a href="/console">See how it works under the hood</a></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (n) => Number(n).toLocaleString("en-GB", { style: "currency", currency: "EUR" });
const dayOf = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-GB",
  { weekday: "long", day: "numeric", month: "long" });
const momentOf = (iso) => new Date(iso).toLocaleString("en-GB",
  { weekday: "long", hour: "2-digit", minute: "2-digit" });
// Our reading of the wholesaler's unit codes; anything unknown is shown as it is.
const UNITS = { ST: "pcs", KI: "cases", KG: "kg", PAK: "packs", BAG: "bags", BOT: "bottles",
  RAS: "boxes", PRK: "jars", SK: "sacks", CS: "cases", KRT: "cartons", KAN: "canisters" };
const AMOUNT = { L: "litres", KG: "kg", SALES_UNIT: "units" };
// The interface speaks of "agents" and "mandates". A cook has an assistant and rules.
const plain = (text) => String(text)
  .replace(/\bthe agent's\b/g, "your assistant's").replace(/\bThe agent\b/g, "Your assistant")
  .replace(/\bthe agent\b/g, "your assistant").replace(/\bthe buyer's\b/g, "your")
  .replace(/\bmandate\b/g, "rules").replace(/ EUR\b/g, " €")
  .replace(/^Needs human approval: /, "").replace(/^Refused by the rules: /, "");

let me = null;
let lastState = "";
let saving = false;

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json();
  if (!response.ok) throw new Error(body.detail || response.statusText);
  return body;
}

const lineText = (line) =>
  `${Number(line.units).toLocaleString("en-GB")} ${UNITS[line.sales_unit] || line.sales_unit} of ${line.name}`;

function reason(rule, order, limit) {
  // The commonest case gets the shortest wording; the others keep the gateway's own sentence.
  if (rule.rule === "spend_limit") {
    return rule.message.includes(" plus ")
      ? `It costs ${eur(order.option.total)}. Together with what it already ordered for that `
        + `day, that is more than the ${eur(limit)} it may spend on its own.`
      : `It costs ${eur(order.option.total)}. On its own it may spend up to ${eur(limit)} a day.`;
  }
  if (rule.rule === "stated_preferences") {
    const unmet = [...new Set(order.option.lines.flatMap((line) => line.unmet_preferences))];
    return `Nothing you prefer can arrive in time. This one is ${unmet.join(", ")}.`;
  }
  return plain(rule.message);
}

function askCard(order, limit) {
  const option = order.option;
  const reasons = order.policy.rules.filter((r) => r.outcome === "needs_approval")
    .map((r) => `<div>${esc(reason(r, order, limit))}</div>`).join("");
  const total = `${Number(option.quantity_covered).toLocaleString("en-GB")} ${AMOUNT[option.unit]}`;
  return `<section class="card ask" aria-label="Order waiting for you">
    ${order.need_text ? `<p class="asked">You asked: “${esc(order.need_text)}”</p>` : ""}
    <p class="what">${option.lines.map((l) => esc(lineText(l))).join("<br>")}</p>
    <div class="sub">${esc(total)} in total · arrives ${dayOf(option.delivery_date)}</div>
    <p class="price">${eur(option.total)} <span class="sub">+ VAT</span></p>
    <div class="why"><b>Why your assistant is asking you</b>${reasons}</div>
    ${option.order_by ? `<p class="sub" style="margin:12px 0 0">Decide before
      ${momentOf(option.order_by)}, or it cannot arrive on ${dayOf(option.delivery_date)}.</p>` : ""}
    <div class="buttons">
      <button class="yes" data-decide="${esc(order.id)}" data-approved="true">Yes, order it</button>
      <button class="no" data-decide="${esc(order.id)}" data-approved="false">No</button>
    </div>
  </section>`;
}

function doneItem(entry) {
  if (entry.kind === "failed") {
    const day = dayOf(entry.request.need.deliver_by);
    return `<div class="item"><span class="name">${esc(entry.request.need.text || entry.request.need.query)}</span>
      <span></span><span class="note"><span class="pill stop">Not ordered</span>
        Nothing that fits can arrive by ${day}. Ask your assistant for another day or product.</span></div>`;
  }
  const order = entry.order;
  const notes = {
    confirmed: order.approval
      ? ["ok", "Ordered", `${esc(order.approval.approver)} said yes.`]
      : ["ok", "Ordered", "Within your rules, so it did not need to ask you."],
    pending_approval: ["wait", "Waiting for you", "See above."],
    rejected: ["stop", "Not ordered", `${esc(order.approval?.approver || "You")} said no.`],
    denied: ["stop", "Blocked", esc(plain(order.status_reason))],
    expired: ["stop", "Too late", esc(plain(order.status_reason))],
  }[order.status];
  return `<div class="item">
    <span class="name">${order.option.lines.map((l) => esc(lineText(l))).join("<br>")}</span>
    <span class="amount">${eur(order.option.total)}</span>
    <span class="note"><span class="pill ${notes[0]}">${notes[1]}</span>${notes[2]}
      ${order.status === "confirmed" ? ` Arrives ${dayOf(order.option.delivery_date)}.` : ""}</span></div>`;
}

function render(orders, requests, agent) {
  const mandate = agent.mandate;
  $("buyer").textContent = agent.buyer_name;
  const people = mandate.approvers.length ? mandate.approvers : ["The kitchen"];
  if (!people.includes(me)) me = people[0];
  $("me").innerHTML = people.map((p) => `<option ${p === me ? "selected" : ""}>${esc(p)}</option>`).join("");

  const waiting = orders.filter((o) => o.status === "pending_approval");
  $("asks").innerHTML = waiting.length
    ? `<h2 style="margin-top:0">Needs your OK</h2>${waiting
        .map((order) => askCard(order, mandate.max_autonomous_spend)).join("")}`
    : `<div class="card calm"><div class="tick">✓</div>
        <p><b>Nothing needs you right now.</b></p>
        <p class="sub">Your assistant is ordering within your rules.</p></div>`;

  const ordered = new Set(orders.map((o) => o.request_id));
  const entries = [
    ...orders.map((order) => ({ kind: "order", at: order.created_at, order })),
    ...requests.filter((r) => !ordered.has(r.id) && !r.options.length)
      .map((request) => ({ kind: "failed", at: request.created_at, request })),
  ].sort((a, b) => b.at.localeCompare(a.at)).slice(0, 8);
  $("done").innerHTML = entries.map(doneItem).join("")
    || '<p class="sub" style="margin:0">Nothing yet. Tell your assistant what the kitchen needs.</p>';

  const rule = (name, title, hint) => `<div class="rule"><div>${title}<small>${hint}</small></div>
    <label class="switch"><input type="checkbox" data-rule="${name}" ${mandate[name] ? "checked" : ""}
      aria-label="${esc(title)}"><span></span></label></div>`;
  $("rules").innerHTML = `
    <div class="rule spend"><div>It may spend this much a day without asking me
        <small>Per delivery day, before VAT. Above it, it asks.</small></div>
      <div class="stepper"><button data-step="-100" aria-label="Lower the limit">−</button>
        <input id="limit" type="number" min="0" step="100" inputmode="numeric"
          value="${mandate.max_autonomous_spend}" aria-label="Daily limit in euros">
        <button data-step="100" aria-label="Raise the limit">+</button></div></div>
    ${rule("allow_substitutes", "Replace a missing product with a similar one",
      "Never one that adds an allergen. Not more than " + mandate.substitute_max_price_increase_pct + "% dearer.")}
    ${rule("allow_outside_preferences", "Take the regular one when my preference is sold out",
      "For example regular milk when organic cannot arrive in time.")}
    ${rule("allow_partial", "Accept less than I asked for", "When stock does not cover everything.")}
    ${rule("allow_late", "Accept a later delivery day", "When it cannot arrive on the day I asked.")}
    <p class="never">It can never order something that breaks an allergy rule. Nobody can
      switch that off, and no approval overrides it.</p>`;
}

async function refresh(force = false) {
  try {
    const [orders, requests, agents] = await Promise.all([
      api("/v1/desk/orders"), api("/v1/desk/requests"), api("/v1/desk/mandates")]);
    const state = JSON.stringify([orders, requests, agents[0]]);
    const busy = saving || ["INPUT", "SELECT"].includes(document.activeElement?.tagName);
    if (force || (state !== lastState && !busy)) {
      lastState = state;
      render(orders, requests, agents[0]);
    }
  } catch (error) { /* keep the last picture; the next poll tries again */ }
}

async function saveRules(change) {
  saving = true;
  try {
    const agent = (await api("/v1/desk/mandates"))[0];
    await api(`/v1/desk/mandates/${encodeURIComponent(agent.agent_id)}`, {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(change) });
    $("saved").style.visibility = "visible";
    setTimeout(() => { $("saved").style.visibility = "hidden"; }, 1800);
  } catch (error) { alert(error.message); }
  saving = false;
  document.activeElement?.blur();
  refresh(true);
}

document.addEventListener("click", async (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.step) {
    const next = Math.max(0, Number($("limit").value) + Number(button.dataset.step));
    $("limit").value = next;
    return saveRules({ max_autonomous_spend: Math.max(1, next) });
  }
  if (button.dataset.decide) {
    button.disabled = true;
    try {
      await api(`/v1/desk/orders/${encodeURIComponent(button.dataset.decide)}/decision`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approver: me, approved: button.dataset.approved === "true" }) });
    } catch (error) { alert(error.message); }
    refresh(true);
  }
});
document.addEventListener("change", (event) => {
  const target = event.target;
  if (target.id === "me") { me = target.value; target.blur(); }
  else if (target.id === "limit") saveRules({ max_autonomous_spend: Math.max(1, Number(target.value)) });
  else if (target.dataset.rule) saveRules({ [target.dataset.rule]: target.checked });
});

refresh(true);
setInterval(refresh, 2000);
</script>
</body>
</html>
